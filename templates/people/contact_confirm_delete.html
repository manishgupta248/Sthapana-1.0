{% extends "base.html" %}

{% block title %}Delete Contact Details — Sthapana{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Delete Contact Details</h1>
</div>

<div class="card border-0" style="max-width: 560px;">
  <div class="card-body">
    <div class="alert alert-danger mb-4">
      <i class="bi bi-exclamation-triangle me-1"></i>
      Are you sure you want to permanently delete the contact details for
      <strong>{{ employee.full_name }}</strong>? This cannot be undone.
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash me-1"></i> Yes, delete permanently
        </button>
        <a href="{% url 'people:employee_detail' employee.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
