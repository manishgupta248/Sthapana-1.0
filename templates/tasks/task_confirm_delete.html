{% extends "base.html" %}

{% block title %}Delete Task — Sthapana{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Delete Task</h1>
</div>

<div class="card" style="max-width: 560px;">
  <div class="card-body">
    <p class="mb-4">
      Are you sure you want to permanently delete
      <strong>"{{ task.title }}"</strong>? This cannot be undone.
    </p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-danger">
          <i class="bi bi-trash me-1"></i> Yes, delete permanently
        </button>
        <a href="{% url 'tasks:task_detail' task.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
