{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'dashboard' %}">
      <img src="{% static 'images/Logo.png' %}" alt="Sthapana logo" height="30">
      <span>Sthapana</span>
    </a>

    <div class="d-flex ms-auto align-items-center gap-2">
      {% if user.is_authenticated %}
        <span class="navbar-text d-none d-sm-inline">
          <i class="bi bi-person-circle me-1"></i>
          {{ user.username }}
        </span>
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i> Log out
          </button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
          <i class="bi bi-box-arrow-in-right me-1"></i> Log in
        </a>
        <a href="{% url 'register' %}" class="btn btn-light btn-sm">
          Request account
        </a>
      {% endif %}
    </div>
  </div>
</nav>
