{% extends "base.html" %}
{% block title %}Delete Task{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Delete Task</h1>
<div class="card p-4" style="max-width: 600px;">
  <p>Are you sure you want to permanently delete <strong>"{{ task.title }}"</strong>? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete permanently</button>
    <a href="{% url 'tasks:task_detail' task.pk %}" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
